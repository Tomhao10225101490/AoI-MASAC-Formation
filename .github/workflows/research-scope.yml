name: Research scope and core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_research_scope.py
      - run: pip install numpy torch pytest
      - run: python -m pytest -q tests/test_actor_gradient.py tests/test_planning_mission.py tests/test_masac_structured.py
