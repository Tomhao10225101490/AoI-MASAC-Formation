# The run that can actually tell the story.
#
# The leader flies the route: climb the 50 m and 70 m roofs, go around the
# 160 m building. Followers are what we train. A collision is recorded and
# penalized, but it does not end the episode, so every episode reaches the
# three buildings. The oracle arm is not trained; it tracks the true slot and
# shows the altitude the route itself demands.
name: story_route
out: results/story_residual
device: cpu
workers: 2
seeds: [0, 1, 2]
env:
  leader_mode: route
  follower_mode: residual
  end_on_collision: false
  max_steps: 700
  w_residual: 0.08
train:
  episodes: 50
  warmup_steps: 400
  start_steps: 0
  batch_size: 256
  hidden: 256
  buffer_size: 120000
  eval_every: 10
  eval_episodes: 2
  save_every: 25
  log_update_every: 400
  ou_episodes: 0
  # The tracker already flies the believed slot. Keep the correction near
  # zero unless the reward says a deviation is worth it.
  target_entropy: -12.0
  init_log_std: -2.5
  residual_noise: 0.08
  action_l2: 0.4
eval:
  episodes: 6
  p0_values: [1.0, 0.6, 0.3]
  seed: 3000
  trajectory_p0: 0.6
claim: >
  The follower tracks the slot it is allowed to believe. A zero correction
  leaves that tracker alone. Belief can replace the tracker when the slot
  standard deviation says the mean is not credible, so the true altitude
  error over the 50 m and 70 m roofs falls below the no-std ablation. The
  building above the ceiling is flown around, not climbed.
arms:
  - id: route_oracle
    enabled: true
    train: false
    role: oracle
    config: configs/paper_belief_masac.yaml
    label: Oracle
    env:
      follower_mode: slot
    question: Geometry only. Leader flies the route, followers track the true slot.
  - id: belief
    enabled: true
    role: method
    config: configs/paper_belief_masac.yaml
    label: Belief
    question: Sees slot standard deviation while the leader flies the route.
  - id: belief_point
    enabled: true
    role: ablation
    config: configs/paper_belief_point_masac.yaml
    label: No std
    question: Same coast and age, standard deviation removed.
  - id: no_blockage
    enabled: true
    role: control
    config: configs/paper_no_blockage.yaml
    label: No blockage
    question: Same belief observation, but roofs do not cut the radio or inflate the doubt.
