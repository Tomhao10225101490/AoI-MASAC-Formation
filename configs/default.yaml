# CPU-scale debug config for the cluttered transit task.
# `python train.py` uses this file. It is shorter than configs/paper_*.yaml.
# Reward weights match the new dynamics (0.2 s steps, 16 m/s cruise) and are
# a starting point, not a tuned result.

algo: belief_masac
seed: 0
device: auto

env:
  map_width: 1200
  map_height: 800
  n_followers: 4
  dt: 0.2
  max_steps: 500
  v_min: 0.0
  v_max: 16.0
  max_accel: 6.0
  max_yaw_rate: 1.2
  uav_radius: 4.0
  wp_radius: 30.0
  formation_tol: 18.0
  formation_spacing: 32.0
  formation_scale: 96.0
  n_nearest_obstacles: 3
  max_obstacles: 11
  max_waypoints: 4
  # Buildings and crossing traffic live in envs/scenario.py so the geometry
  # tests and the default config cannot drift apart. Leave obstacles unset
  # here; override the list only when you want a different map.
  channel_mode: distance
  p0: 0.95
  d0: 200.0
  nlos_factor: 0.2
  blockage_margin: 0.0
  use_blockage: true
  randomize_channel: true
  p0_low: 0.45
  p0_high: 1.0
  aoi_cap: 40
  obs_mode: belief
  use_aoi: true
  nlos_q_scale: 4.0
  sensor_range: 250.0
  start_xy: [150.0, 420.0]
  start_speed: 10.0
  start_noise: 12.0
  wind_max: 4.0
  randomize_wind: true
  wind_obs_noise: 0.5
  seed: 0
  w_progress: 0.25
  w_heading: 0.05
  w_formation: 0.02
  w_form_progress: 0.25
  # Formation cost is linear only up to this many meters. Past the cap it
  # does not grow, so a long bad episode cannot become cheaper than a crash.
  formation_error_cap: 80.0
  w_smooth: 0.02
  w_step: 0.01
  w_clearance: 0.5
  clearance_margin: 20.0
  formation_bonus: 0.15
  # Worse than flying max_steps at the formation-error cap.
  # 0.02 m^-1 * 80 m * sum_{k=0}^{499} 0.99^k ≈ 159, and 250 is above that.
  collision_penalty: 250.0
  success_bonus: 40.0
  wp_bonus: 8.0
  oob_penalty: 1.0

train:
  episodes: 40
  warmup_steps: 2000
  start_steps: 800
  batch_size: 128
  updates_per_step: 1
  gamma: 0.99
  tau: 0.005
  lr_actor: 0.0003
  lr_critic: 0.0003
  lr_alpha: 0.0003
  hidden: 128
  buffer_size: 100000
  grad_clip: 1.0
  # SAC explores via entropy. Leave this at 0.
  ou_episodes: 0
  ou_sigma: 0.2
  expl_noise: 0.1
  policy_delay: 2
  target_noise: 0.2
  noise_clip: 0.5
  eval_every: 10
  eval_episodes: 5
  save_every: 10
  log_update_every: 50
  log_dir: runs
