# Tiny open-field run. It checks that training writes a checkpoint.
# It is not the paper scenario: no buildings, no wind, two followers.
algo: aoi_masac
seed: 0
device: cpu

env:
  n_followers: 2
  max_steps: 40
  n_nearest_obstacles: 1
  max_obstacles: 1
  max_waypoints: 1
  obstacles: []
  waypoints: [[900.0, 400.0]]
  start_xy: [150.0, 400.0]
  start_speed: 8.0
  start_noise: 0.0
  randomize_channel: false
  randomize_wind: false
  wind_speed: 0.0
  use_blockage: false
  p0: 0.8
  sensor_range: 400.0

train:
  episodes: 3
  warmup_steps: 20
  start_steps: 10
  batch_size: 32
  hidden: 32
  buffer_size: 2000
  updates_per_step: 1
  ou_episodes: 0
  eval_every: 0
  save_every: 3
  log_update_every: 10
  log_dir: runs/smoke
