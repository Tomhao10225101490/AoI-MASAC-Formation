# MATD3 trained on the same belief observation as the proposed method.
# The hold-observation MATD3 config is a different question. This one asks
# whether the solver, rather than the slot standard deviation, is doing the work.
algo: belief_matd3
env:
  max_steps: 500
  obs_mode: belief
  use_aoi: true
  channel_mode: distance
  randomize_channel: true
  p0_low: 0.3
  p0_high: 1.0
  nlos_q_scale: 4.0
train:
  episodes: 800
  warmup_steps: 5000
  start_steps: 2000
  batch_size: 256
  hidden: 256
  buffer_size: 200000
  lr_actor: 0.0001
  lr_critic: 0.001
  expl_noise: 0.15
  policy_delay: 2
  target_noise: 0.2
  noise_clip: 0.5
  eval_every: 25
  eval_episodes: 10
  save_every: 50
  log_dir: runs/paper
