# Same coasted leader state and AoI as Belief-MASAC. The three slot-standard-
# deviation channels are forced to 0. This is the ablation that carries the
# claim: if it matches Belief-MASAC behind a roof, the std channels are unused.
algo: belief_point_masac
env:
  max_steps: 500
  obs_mode: belief_point
  use_aoi: true
  channel_mode: distance
  randomize_channel: true
  p0_low: 0.3
  p0_high: 1.0
  nlos_q_scale: 4.0
train:
  episodes: 800
  warmup_steps: 5000
  start_steps: 2000
  batch_size: 256
  hidden: 256
  buffer_size: 200000
  ou_episodes: 0
  eval_every: 25
  eval_episodes: 10
  save_every: 50
  log_dir: runs/paper
