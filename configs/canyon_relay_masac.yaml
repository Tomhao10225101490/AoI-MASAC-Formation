# Belief-MASAC on the street canyon, with TDMA relay airtime.
# The tracker flies. The policy only commands altitude, and every follower
# is paid the team's mean slot error, so a climb is worth it only when it
# buys the rest of the formation a better belief.
# Regimes (roof penetration, leader manoeuvre, p0) are drawn per episode.
# The in-training probe is the hard corner: nlos_low and leader_jink_high.
algo: belief_masac
env:
  scenario: canyon
  canyon_random: true
  leader_mode: route
  follower_mode: residual
  residual_vertical_only: true
  end_on_collision: false
  max_steps: 600
  obs_mode: belief
  use_aoi: true
  channel_mode: distance
  randomize_channel: true
  p0_low: 0.3
  p0_high: 1.0
  relay_mode: tdma
  relay_period: 2
  leader_jink_random: true
  leader_jink_low: 0.0
  leader_jink_high: 1.0
  leader_jink_yaw: 0.0
  leader_jink_hold: 10
  nlos_random: true
  nlos_low: 0.01
  nlos_high: 0.2
  shared_formation_reward: true
  w_formation: 0.04
  w_residual: 0.01
  formation_error_cap: 60.0
train:
  episodes: 600
  curriculum_perfect_frac: 0.1
  warmup_steps: 2000
  start_steps: 1000
  batch_size: 256
  hidden: 256
  buffer_size: 200000
  lr_actor: 0.0001
  eval_every: 25
  eval_episodes: 6
  save_every: 100
  log_update_every: 500
  ou_episodes: 0
  target_entropy: -6.0
  init_log_std: -1.0
  residual_noise: 0.12
  action_l2: 0.0
  expl_noise: 0.05
  log_dir: runs/canyon_relay
